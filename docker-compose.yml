version: '3.8'

services:
  frontend:
    build:
      context: ./client
    container_name: frontend_branch3
    ports:
      - "4002:4002"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: backend_branch3
    ports:
      - "8005:8005"
    environment:
      - FLASK_ENV=development
    
